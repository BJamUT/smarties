<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smarty Team Directory</title>
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1>Smarty Team Directory</h1>
      <p class="subtitle">Search the Smarties — <span id="result-count"></span></p>
      <div class="controls-row">
        <div class="search-wrap">
          <input
            type="search"
            id="search-input"
            placeholder="Search by name, title, or bio..."
            autocomplete="off"
          />
        </div>
        <div class="sort-wrap">
          <label for="sort-select" class="sort-label">Sort by</label>
          <select id="sort-select">
            <option value="first">First name</option>
            <option value="last">Last name</option>
          </select>
        </div>
      </div>
    </div>
  </header>

  <main id="grid" class="grid"></main>

  <p id="empty-state" class="empty-state" hidden>No Smarties match your search.</p>

  <template id="card-template">
    <article class="card">
      <img class="photo" loading="lazy" />
      <div class="card-body">
        <h2 class="name"></h2>
        <p class="title"></p>
        <p class="bio"></p>
        <a class="linkedin" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.38-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.07 2.07 0 1 1 0-4.13 2.07 2.07 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>
        </a>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
